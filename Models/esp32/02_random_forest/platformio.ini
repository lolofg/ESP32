; Random Forest - PlatformIO project (ESP-IDF framework)
;
; 1. Run the notebook first: it writes the model files into main/
;    (model_data.h, model_info.h, preprocess_data.h, test_data.h)
; 2. Build + upload:   pio run -t upload
; 3. See the results:  pio device monitor
;
; The project is also a normal ESP-IDF project (idf.py build works too).

[platformio]
src_dir = main

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
