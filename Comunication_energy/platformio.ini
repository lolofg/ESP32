; MQTT / CoAP energy measurement (PlatformIO, ESP-IDF) - see README.md
;
; 1. main/secrets.h: Wi-Fi, MQTT broker and CoAP server (copied from Comunication_testing)
; 2. Build + upload:  pio run -t upload --upload-port /dev/ttyACMx
; 3. Unplug USB, power the board from the PPK2 and record

[platformio]
src_dir = main

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
