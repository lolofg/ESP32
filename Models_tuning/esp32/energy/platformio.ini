; Energy measurement firmware - all 11 models in one build (PlatformIO, ESP-IDF)
;
; 1. Run the notebook first (it updates the model projects next to this folder)
; 2. Build + upload:   pio run -t upload        (USB cable connected)
; 3. Optional check:   pio device monitor       (prints the self-test and,
;                      after ~1 minute, the time of every block)
; 4. Unplug USB, power the board from the PPK2 and record (see README.md)

[platformio]
src_dir = main

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
